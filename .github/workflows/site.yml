name: site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
      branch: ${{ steps.pages.outputs.branch }}
    steps:
      - name: How is Pages configured?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          info=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null || echo "{}")
          build_type=$(echo "$info" | jq -r '.build_type // "none"')
          branch=$(echo "$info" | jq -r '.source.branch // ""')
          path=$(echo "$info" | jq -r '.source.path // "/"')
          if [ "$build_type" = "workflow" ]; then
            echo "mode=workflow" >> "$GITHUB_OUTPUT"
          elif [ "$build_type" = "none" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled (Settings > Pages). Skipping deploy — this is not a failure."
          elif gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow --silent 2>/dev/null; then
            echo "mode=workflow" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages source was 'deploy from a branch'; switched it to GitHub Actions."
          elif [ -n "$branch" ] && [ "$path" = "/" ]; then
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages serves from branch '$branch'; publishing the site there."
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is configured to serve from '$branch$path', which this workflow cannot fill. Set Settings > Pages > Source to 'GitHub Actions'. Skipping — not a failure."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.mode == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment

  publish-legacy:
    needs: check
    if: needs.check.outputs.mode == 'legacy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the site to the Pages branch
        env:
          BRANCH: ${{ needs.check.outputs.branch }}
        run: |
          git config user.name "the-wall[bot]"
          git config user.email "the-wall-bot@users.noreply.github.com"
          SHA=$(git rev-parse --short HEAD)
          git checkout --orphan site-dist
          touch .nojekyll
          git add -A
          git commit -q -m "site from $SHA"
          git push -f origin "site-dist:$BRANCH"
