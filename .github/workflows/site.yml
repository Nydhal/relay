name: site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Is Pages enabled and set to GitHub Actions?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo "none")
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$build_type" = "none" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled (Settings > Pages > Source: GitHub Actions). Skipping deploy — this is not a failure."
          elif gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages source was 'deploy from a branch'; switched it to GitHub Actions."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is set to deploy-from-branch and the token could not switch it. Set Settings > Pages > Source to 'GitHub Actions'. Skipping deploy — this is not a failure."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
