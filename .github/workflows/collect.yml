name: collect
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search for the marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect.py
      - name: Commit finds
        run: |
          git config user.name "relaywall collector"
          git config user.email "noreply@nselmi.com"
          git add wall/collected || true
          git diff --cached --quiet || git commit -m "collect: $(date -u +%F)" && git push
