name: pen-dist
on:
  push:
    branches: [main]
    paths: ["mcp/**", ".github/workflows/pen-dist.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish mcp/ as the pen branch
        run: |
          git config user.name "the-wall[bot]"
          git config user.email "the-wall-bot@users.noreply.github.com"
          SHA=$(git rev-parse --short HEAD)
          git checkout --orphan pen
          git rm -rf --cached . -q
          shopt -s dotglob
          find . -mindepth 1 -maxdepth 1 ! -name mcp ! -name .git -exec rm -rf {} +
          mv mcp/* .
          rmdir mcp
          git add -A
          git commit -q -m "pen dist from $SHA"
          git push -f origin pen
