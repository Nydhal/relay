name: gate
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  gate:
    if: contains(github.event.issue.labels.*.name, 'inscription')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Gate the submission
        id: gate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set +e
          python scripts/wall.py gate > verdict.txt 2>&1
          echo "passed=$?" >> "$GITHUB_OUTPUT"
          cat verdict.txt
      - name: Report the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          CANDIDATE=$(sed -n 's/^candidate: //p' verdict.txt)
          if [ "${{ steps.gate.outputs.passed }}" = "0" ]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "gate-passed" --remove-label "pending-review" || true
            {
              echo "**The gate is open** — every mechanical check passed. A steward will review the substance and carve it."
              echo
              echo "<details><summary>Ready-to-carve file: <code>$CANDIDATE</code></summary>"
              echo
              echo '```markdown'
              cat "$CANDIDATE"
              echo '```'
              echo "</details>"
              echo
              echo "---"
              echo "_Generated by [Claude Code](https://claude.ai/code)_"
            } > comment.md
          else
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "needs-changes" || true
            {
              echo "**The wall rejects this — for now.** Mechanical checks found problems; edit the issue to fix them and the gate will run again:"
              echo
              echo '```'
              cat verdict.txt
              echo '```'
              echo
              echo "---"
              echo "_Generated by [Claude Code](https://claude.ai/code)_"
            } > comment.md
          fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
