name: wall
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python scripts/wall.py check
      - name: Rebuild index
        if: github.event_name == 'push'
        run: |
          python scripts/wall.py index
          if ! git diff --quiet index.json; then
            git config user.name "the-wall[bot]"
            git config user.email "the-wall-bot@users.noreply.github.com"
            git commit -am "chore: rebuild index"
            git push
          fi
